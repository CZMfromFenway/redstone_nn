<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>四期 · 调色板替换方案编辑器</title>
<style>
  :root{--bg:#101216;--panel:#171b23;--line:#2a3140;--txt:#dfe6f2;--dim:#93a0b4;--acc:#4a86e8}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--txt);
       font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .cols{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .left{flex:0 0 660px}
  .right{flex:1 1 380px;min-width:360px}
  .rowhdr,.row{display:grid;grid-template-columns:24px 40px 128px 48px 1fr;gap:8px;align-items:start}
  .rowhdr{color:var(--dim);font-size:11px;padding:0 4px 6px}
  .row{padding:6px 4px;border-radius:7px;border:1px solid transparent;cursor:pointer}
  .row:hover{background:#1e2431}
  .row.active{border-color:var(--acc);background:#1c2740}
  .row.skip{opacity:.6}
  .sw{width:40px;height:40px;border-radius:5px;border:1px solid #000}
  .meta{font-size:11px;color:var(--dim);line-height:1.35}
  .meta b{color:var(--txt);font-weight:600}
  .alts{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:3px;border:1px dashed #39445a;
        border-radius:7px}
  .alts.over{border-color:var(--acc);background:#1b2333}
  .alt{display:flex;align-items:center;gap:4px;background:#1b2130;border:1px solid #2f3a4d;
       border-radius:6px;padding:2px 4px;font-size:10px}
  .alt .c{width:26px;height:26px;border-radius:4px;border:1px solid #000}
  .alt .dl{font-weight:600}
  .alt input{width:30px;background:#141821;color:var(--txt);border:1px solid #2f3a4d;
             border-radius:4px;font-size:10px;padding:1px 3px;text-align:center}
  .alt .x{background:none;border:0;color:#7f8ba0;cursor:pointer;font-size:13px;padding:0 2px}
  .alt .x:hover{color:#eb5757}
  .drop-hint{color:#5d6879;font-size:10px;align-self:center;padding:0 4px}
  .pwrap{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
  .pwrap input[type=range]{width:56px;accent-color:var(--acc)}
  .pool{display:flex;flex-wrap:wrap;gap:5px;max-height:430px;overflow:auto;padding:4px}
  .chip{border:1px solid #2f3a4d;border-radius:6px;padding:3px;cursor:grab;background:#1b2130;
        width:74px;font-size:9px;color:var(--dim);text-align:center}
  .chip:hover{border-color:#4a6b9a}
  .chip .c{height:30px;border-radius:4px;border:1px solid #000;margin-bottom:2px}
  .chip.dl1{border-color:#3f9d57}.chip.dl2{border-color:#b08a2f}.chip.dl3{border-color:#8c4a4a}
  .tag{display:inline-block;font-size:9px;padding:0 4px;border-radius:3px;margin-left:4px}
  .t-skin{background:#4a3a1f;color:#e8c98a}.t-ext{background:#3c2530;color:#e59aa5}
  #faces{display:flex;flex-wrap:wrap;gap:5px}
  canvas.face{image-rendering:pixelated;width:48px;height:48px;border:1px solid var(--line);
              border-radius:4px}
  .bar{height:8px;background:#1b2130;border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--acc)}
  button{background:#1b2130;color:var(--txt);border:1px solid #2f3a4d;border-radius:7px;
         padding:6px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:#4a6b9a;background:#212a3c}
  button.primary{background:#1d3b66;border-color:#3a6ea5}
  .btnrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}
  select{background:#1b2130;color:var(--txt);border:1px solid #2f3a4d;border-radius:6px;padding:5px 8px}
  .warn{color:#e8b04a}.bad{color:#eb5757}.ok{color:#6fcf97}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
</style>
</head>
<body>
<h1>调色板替换方案编辑器（每槽可多个候选）</h1>
<div class="sub">
  左侧 16 个槽位按原色明度排列。把右侧 HIGH 色<b>拖进某个槽位</b>即可加入它的候选集合（可拖多个）；
  每槽有自己的「被换概率」，候选之间按权重抽。右侧实时用 24 张样本脸显示效果。
</div>

<div class="cols">
  <div class="panel left">
    <div class="btnrow">
      <label style="color:var(--dim);font-size:12px">载入预设</label>
      <select id="preset"></select>
      <button id="reset">清空全部</button>
      <button id="fillAll" title="给所有可换槽位加满各自的保亮度候选">自动填满</button>
    </div>
    <div class="rowhdr"><span>#</span><span>原色</span><span>槽位 / 明度 / 用量</span><span>概率</span><span>候选（可多个，数字为权重）</span></div>
    <div id="rows"></div>
    <hr>
    <div style="font-size:11px;color:var(--dim);line-height:1.8" id="summary"></div>
  </div>

  <div class="panel right">
    <div class="btnrow">
      <span style="font-size:12px;color:var(--dim)" id="poolhint">候选池：61 个 HIGH 色</span>
      <label style="font-size:12px;color:var(--dim);margin-left:auto">
        <input type="checkbox" id="onlyClose"> 只看 |ΔL|≤1</label>
      <button id="sortL">按明度</button>
      <button id="sortD">按 ΔL</button>
    </div>
    <div class="pool" id="pool"></div>
    <hr>
    <div class="btnrow">
      <label style="font-size:12px;color:var(--dim)">预览模式</label>
      <select id="mode">
        <option value="perface">每张脸独立抽</option>
        <option value="uniform">整批同一套</option>
        <option value="variants">同一张脸 3 个变体</option>
      </select>
      <button id="resample">重抽</button>
    </div>
    <div id="faces"></div>
    <hr>
    <div class="btnrow">
      <button class="primary" id="save">保存方案 JSON</button>
      <button id="copy">复制 JSON</button>
      <span style="font-size:11px;color:var(--dim)" id="savemsg"></span>
    </div>
  </div>
</div>

for (let p=0;p<32;p++){ ROW.push(p%8); COL.push((p-(p%8))/8); }

// alts[i] = [{rgb,name,L,mod,weight}], p[i] = 被换概率 0..1
const S = { alts:{}, p:{}, active:null, onlyClose:false, sortBy:'L',
            mode:'perface', seed:1 };

function rnd(){ S.seed = (S.seed*1664525 + 1013904223) >>> 0; return S.seed/4294967296; }
function hex(rgb){ return '#' + rgb.map(v=>Math.min(255,Math.max(0,Math.round(v*17)))
                                          .toString(16).padStart(2,'0')).join(''); }
function slotOf(i){ return D.slots[i]; }
function chipIsSkin(h){ return h.h>=8 && h.h<=55 && h.s>0.15 && h.L>=3.5 && h.L<=13.5; }
function chipIsExt(h){ return h.L<2.5 || h.L>13.0; }

/* ---------- 行 ---------- */
function renderRows(){
  const box = document.getElementById('rows');
  box.innerHTML = '';
  const order = D.slots.map(s=>s.i).sort((a,b)=>D.slots[a].L - D.slots[b].L);
  order.forEach(i => {
    const s = D.slots[i];
    const list = S.alts[i] || [];
    const row = document.createElement('div');
    row.className = 'row' + (S.active===i?' active':'') + (s.kind!=='backbone'?' skip':'');
    row.innerHTML =
      '<span style="color:#7f8ba0">'+i+'</span>' +
      '<div class="sw" style="background:'+hex(s.rgb)+'"></div>' +
      '<div class="meta"><b>'+s.name.replace('TERRACOTTA_','T_')+'</b>' +
        (s.kind!=='backbone'?'<span class="tag '+(s.kind==='skin'?'t-skin':'t-ext')+'">'+
          (s.kind==='skin'?'肤色':'极端')+'</span>':'') +
        '<br>L '+s.L.toFixed(1)+' · s '+s.sat.toFixed(2)+' · h '+s.hue.toFixed(0)+'°' +
        '<br>用量 '+((s.use||0)*100).toFixed(1)+'%</div>' +
      '<div class="pwrap"><input type="range" min="0" max="100" step="5" ' +
        'value="'+Math.round((S.p[i]!=null?S.p[i]:(list.length?1:0))*100)+'" ' +
        'data-p="'+i+'"><span data-pv="'+i+'">' +
        Math.round((S.p[i]!=null?S.p[i]:(list.length?1:0))*100)+'%</span></div>' +
      '<div class="alts" data-alt="'+i+'"></div>';
    const alts = row.querySelector('.alts');
    if (!list.length){
      const h = document.createElement('span');
      h.className = 'drop-hint'; h.textContent = '拖 HIGH 色到这里（可多个）';
      alts.appendChild(h);
    }
    list.forEach((a, k) => {
      const d = a.L - s.L;
      const cls = Math.abs(d)<=1?'ok':Math.abs(d)<=2.5?'warn':'bad';
      const el = document.createElement('div');
      el.className = 'alt';
      el.innerHTML = '<div class="c" style="background:'+hex(a.rgb)+'"></div>' +
        '<div><b class="'+cls+'">'+(d>=0?'+':'')+d.toFixed(1)+'</b><br>' +
        (a.name||'').replace('TERRACOTTA_','T_').slice(0,12) + '</div>' +
        '<input type="number" min="0" step="1" value="'+a.weight+'" data-w="'+i+':'+k+'">' +
        '<button class="x" data-del="'+i+':'+k+'">×</button>';
      el.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain',''));
      alts.appendChild(el);
    });
    row.addEventListener('click', ev => {
      const del = ev.target.dataset && ev.target.dataset.del;
      if (del){
        const [si,k] = del.split(':').map(Number);
        S.alts[si].splice(k,1); if (!S.alts[si].length) delete S.alts[si];
        renderAll(); return;
      }
      if (ev.target.dataset && ev.target.dataset.p !== undefined) return;
      if (ev.target.tagName === 'INPUT') return;
      S.active = (S.active===i ? null : i);
      renderAll();
    });
    alts.addEventListener('dragover', ev => { ev.preventDefault(); alts.classList.add('over'); });
    alts.addEventListener('dragleave', () => alts.classList.remove('over'));
    alts.addEventListener('drop', ev => {
      ev.preventDefault(); alts.classList.remove('over');
      const ci = parseInt(ev.dataTransfer.getData('text/plain'),10);
      if (!isNaN(ci)) addAlt(i, ci);
    });
    box.appendChild(row);
  });
  // 概率滑杆
  box.querySelectorAll('input[type=range]').forEach(el => {
    el.addEventListener('input', () => {
      const i = Number(el.dataset.p);
      S.p[i] = Number(el.value)/100;
      const lab = box.querySelector('[data-pv="'+i+'"]');
      if (lab) lab.textContent = el.value + '%';
      renderSummary(); renderFaces();
    });
  });
  box.querySelectorAll('input[type=number]').forEach(el => {
    el.addEventListener('input', () => {
      const [i,k] = el.dataset.w.split(':').map(Number);
      S.alts[i][k].weight = Math.max(0, Number(el.value)||0);
      renderFaces();
    });
  });
}

function addAlt(slot, chipIdx){
  const h = D.high[chipIdx];
  S.alts[slot] = S.alts[slot] || [];
  if (S.alts[slot].some(a => Math.abs(a.L-h.L)<1e-6 && a.name===h.name)) return;
  S.alts[slot].push({rgb:h.rgb, name:h.name, mod:'HIGH', L:h.L, sat:h.s, hue:h.h, weight:1});
  if (S.p[slot] == null) S.p[slot] = 1;
  renderAll();
}

  const box = document.getElementById('pool');
  box.innerHTML = '';
  const act = S.active;
  document.getElementById('poolhint').textContent =
    '候选池：61 个 HIGH 色' + (act!=null ? '（ΔL 相对 #'+act+' '+D.slots[act].name+'）' : '');
  let list = D.high.map((h,i)=>({h,i}));
  if (act != null){
    const L0 = D.slots[act].L;
    list.forEach(o => o.d = o.h.L - L0);
    if (S.onlyClose) list = list.filter(o => Math.abs(o.d) <= 1.0);
    list.sort(S.sortBy==='D' ? (a,b)=>Math.abs(a.d)-Math.abs(b.d) : (a,b)=>a.h.L-b.h.L);
  } else list.sort((a,b)=>a.h.L-b.h.L);
  list.forEach(o => {
    const c = document.createElement('div');
    const k = Math.abs(o.d||0);
    c.className = 'chip' + (act!=null ? (k<=1?' dl1':k<=2.5?' dl2':' dl3') : '');
    c.draggable = true;
    c.title = o.h.name+' · L '+o.h.L.toFixed(1);
    c.innerHTML = '<div class="c" style="background:'+hex(o.h.rgb)+'"></div>' +
      'L'+o.h.L.toFixed(0) + (act!=null ? ' <b>'+o.d.toFixed(1)+'</b>' : '') +
      '<br>'+o.h.name.replace('TERRACOTTA_','T_').slice(0,11) +
      '<br><span style="color:#6f7b90">s'+o.h.s.toFixed(2)+' h'+o.h.h.toFixed(0)+'°</span>' +
      (chipIsSkin(o.h)?'<br><span style="color:#e8c98a">肤色</span>':
       chipIsExt(o.h)?'<br><span style="color:#e59aa5">极端L</span>':'');
    c.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain', String(o.i)));
    c.addEventListener('click', () => {
      if (S.active!=null) addAlt(S.active, o.i);
      else { S.active = null; }
    });
    box.appendChild(c);
  });
}

/* ---------- 采样与预览 ---------- */
function paletteOnce(){
  return D.slots.map(s => {
    const list = S.alts[s.i];
    const p = (S.p[s.i]!=null ? S.p[s.i] : (list && list.length ? 1 : 0));
    if (!list || !list.length || rnd() >= p) return s.rgb;
    const tot = list.reduce((a,b)=>a+(b.weight||0),0);
    if (tot <= 0) return s.rgb;
    let x = rnd()*tot;
    for (const a of list){ x -= (a.weight||0); if (x <= 0) return a.rgb; }
    return list[list.length-1].rgb;
  });
}
function toPal(pal){ return pal.map(c => c.map(v=>Math.min(255,Math.max(0,Math.round(v*17))))); }

function renderFaces(){
  const box = document.getElementById('faces');
  const n = D.faces.length;
  const rows = S.mode==='variants' ? 3 : 1;
  box.innerHTML = '';
  const pals = [];
  if (S.mode === 'uniform'){ const one = toPal(paletteOnce()); for (let r=0;r<rows;r++) pals.push(one); }
  else for (let r=0;r<rows;r++) pals.push(null);   // 每张脸各自抽
  for (let r=0;r<rows;r++){
    for (let k=0;k<n;k++){
      const cv = document.createElement('canvas');
      cv.className='face'; cv.width=8; cv.height=8;
      box.appendChild(cv);
      const pal = pals[r] || toPal(paletteOnce());
      const idx = D.faces[k].idx;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(8,8);
      for (let p=0;p<32;p++){
        const c = pal[idx[p]];
        for (const cc of [COL[p], 7-COL[p]]){
          const q = (ROW[p]*8+cc)*4;
          img.data[q]=c[0]; img.data[q+1]=c[1]; img.data[q+2]=c[2]; img.data[q+3]=255;
        }
      }
      ctx.putImageData(img,0,0);
    }
  }
}

/* ---------- 汇总 ---------- */
function renderSummary(){
  const slots = Object.keys(S.alts).map(Number).filter(i => S.alts[i].length);
  const nAlt = slots.reduce((a,i)=>a+S.alts[i].length,0);
  let wsum = 0, dsum = 0, cnt = 0;
  slots.forEach(i => S.alts[i].forEach(a => {
    const w = a.weight||0; wsum += w; dsum += w*Math.abs(a.L - D.slots[i].L); cnt += w;
  }));
  const meanDL = cnt ? dsum/cnt : 0;
  const affected = slots.reduce((a,i)=>{
    const p = (S.p[i]!=null ? S.p[i] : 1);
    return a + (D.slots[i].use||0)*p;
  }, 0);
  const warnSkin = slots.filter(i => D.slots[i].kind==='skin');
  const warnExt  = slots.filter(i => D.slots[i].kind==='extreme');
  let html = '';
  html += `有候选的槽 <b>${slots.length}</b> / 10（可换槽位）· 候选总数 <b>${nAlt}</b>`;
  html += ` · 加权平均 |ΔL| <b>${meanDL.toFixed(2)}</b><br>`;
  html += `预计被改动的像素：<b>${(affected*100).toFixed(1)}%</b>（Σ 用量×概率；黑+白占 `
        + `${(D.cost.pixels_black_white*100).toFixed(0)}% 且通常不可换）`;
  html += '<div class="bar" style="margin:6px 0"><i style="width:'+
          Math.min(100,affected*100).toFixed(1)+'%"></i></div>';
  if (warnSkin.length) html += `<span class="warn">注意：动了肤色槽 ${warnSkin.join(',')}</span><br>`;
  if (warnExt.length)  html += `<span class="warn">注意：动了极端明度槽 ${warnExt.join(',')}</span><br>`;
  if (!slots.length) html += '<span class="ok">当前是原色板</span>';
  document.getElementById('summary').innerHTML = html;
}

function renderAll(){ renderRows(); renderPool(); renderFaces(); renderSummary(); }

/* ---------- 预设 / 导出 ---------- */
function applyPreset(name){
  S.alts = {}; S.p = {}; S.active = null;
  const pr = D.presets[name];
  if (pr) pr.swaps.forEach(sw => {
    S.alts[sw.slot] = [{rgb:sw.rgb, name:sw.name, mod:'MAP', L:sw.L,
                        sat:sw.sat, hue:sw.hue, weight:1}];
    S.p[sw.slot] = 1;
  });
  renderAll();
}

function schemeJSON(){
  const slots = [];
  Object.keys(S.alts).map(Number).sort((a,b)=>a-b).forEach(i => {
    if (!S.alts[i].length) return;
    const s = D.slots[i];
    slots.push({
      slot: i, from: s.name, from_rgb: s.rgb, from_L: s.L,
      p: +( (S.p[i]!=null?S.p[i]:1) ).toFixed(3),
      usage: s.use,
      alts: S.alts[i].map(a => ({
        rgb: a.rgb.map(v=>+(+v).toFixed(3)),
        name: a.name, mod: a.mod, L: +a.L.toFixed(2),
        dL: +(a.L - s.L).toFixed(2),
        dhue: +Math.min(Math.abs(a.hue-s.hue)%360, 360-Math.abs(a.hue-s.hue)%360).toFixed(0),
        weight: a.weight||1
      }))
    });
  });
  const flat = D.slots.map(s => {
    const list = S.alts[s.i];
    return (list && list.length) ? list[0].rgb : s.rgb;   // 确定性回退：取第一个候选
  });
  const affected = slots.reduce((a,x)=>a + (x.usage||0)*x.p, 0);
  return {
    kind: 'palette_scheme', version: 2,
    created: new Date().toISOString().slice(0,19),
    semantics: '每槽有 p 的概率被替换；替换时在 alts 里按 weight 抽一个；' +
               'p=0 或 alts 为空则该槽永远用原色',
    slots: slots,
    palette_first_alt: flat.map(c=>c.map(v=>+(+v).toFixed(3))),
    summary: {
      n_slots: slots.length,
      n_alts: slots.reduce((a,x)=>a+x.alts.length,0),
      mean_abs_dL: +(slots.length ? slots.reduce((a,x)=>
        a + x.alts.reduce((b,y)=>b+Math.abs(y.dL)*y.weight,0)/
            Math.max(1e-9, x.alts.reduce((b,y)=>b+y.weight,0)), 0)/slots.length : 0).toFixed(2),
      affected_pixel_share: +affected.toFixed(3)
    },
    note: '多候选方案：tools/apply_palette_scheme.py 会写成 palette_sets，页面按每张脸抽样'
  };
}

document.getElementById('save').addEventListener('click', () => {
  const j = JSON.stringify(schemeJSON(), null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([j], {type:'application/json'}));
  a.download = 'palette_scheme.json'; a.click();
  document.getElementById('savemsg').textContent = '已下载';
});
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(schemeJSON()));
        document.getElementById('savemsg').textContent = '已复制'; }
  catch(e){ document.getElementById('savemsg').textContent = '复制失败'; }
});
document.getElementById('reset').addEventListener('click', () => {
  S.alts = {}; S.p = {}; S.active = null; document.getElementById('preset').value='原色板'; renderAll();
});
document.getElementById('preset').addEventListener('change', ev => applyPreset(ev.target.value));
document.getElementById('onlyClose').addEventListener('change', ev => {
  S.onlyClose = ev.target.checked; renderPool();
});
document.getElementById('sortL').addEventListener('click', ()=>{ S.sortBy='L'; renderPool(); });
document.getElementById('sortD').addEventListener('click', ()=>{ S.sortBy='D'; renderPool(); });
document.getElementById('mode').addEventListener('change', ev => {
  S.mode = ev.target.value; renderFaces();
});
document.getElementById('resample').addEventListener('click', () => renderFaces());
document.getElementById('fillAll').addEventListener('click', () => {
  D.slots.forEach(s => {
    if (s.kind !== 'backbone') return;
    S.alts[s.i] = (D.prefill[s.i]||[]).slice();
    if (S.alts[s.i].length) S.p[s.i] = 1;
  });
  renderAll();
});

/* init */
(function(){
  const sel = document.getElementById('preset');
  Object.keys(D.presets).forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k + '（'+D.presets[k].swaps.length+' 槽）';
    sel.appendChild(o);
  });
  const def = D.presets['s30'] ? 's30' : Object.keys(D.presets)[1] || '原色板';
  sel.value = def;
  applyPreset(def);
})();
</script>
