<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>红石 8×8 网络 · 平面生成器 v2（原点基准）</title>
<style>
  :root{--bg:#101014;--pane:#181820;--line:#2c2c38;--fg:#e8e8f0;--dim:#9a9aa8;--acc:#5ad2ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;height:100vh;overflow:hidden}
  #side{width:310px;min-width:310px;background:var(--pane);border-right:1px solid var(--line);padding:14px;overflow-y:auto}
  #main{flex:1;overflow:auto;position:relative}
  h1{font-size:14px;margin:0 0 4px;color:var(--acc)}
  .sub{font-size:11px;color:var(--dim);margin-bottom:12px}
  h2{font-size:11px;margin:16px 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;cursor:pointer}
  label span{color:var(--dim)}
  input[type=number]{width:74px;background:#0c0c10;border:1px solid var(--line);color:var(--fg);padding:3px 6px;border-radius:4px;text-align:right}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
  .info{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--dim)}
  .info b{color:var(--fg)}
  canvas{display:block}
  .lg{position:fixed;left:324px;bottom:10px;background:#16161cE8;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--dim);line-height:1.7}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px;border:1px solid #555}
</style>
</head>
<body>
<div id="side">
  <h1>平面生成器 v2</h1>
  <div class="sub">原点 = 最高权重减法链的第一个比较器<br>（绝对坐标 x=3, z=22）</div>

  <h2>规模</h2>
  <label><span>输入数 n</span><input type="number" id="n" value="4" min="1" max="64" step="1"></label>
  <label><span>位宽 b</span><input type="number" id="b" value="8" min="2" max="12" step="1"></label>

  <h2>方向</h2>
  <label><span>灰线朝低位权方向</span><input type="checkbox" id="greyUp" checked></label>
  <label><span>白线朝低位权方向</span><input type="checkbox" id="whiteUp" checked></label>
  <label><span>输入顺序反转</span><input type="checkbox" id="inRev"></label>
  <label><span>位权朝次方向升高</span><input type="checkbox" id="bitRev"></label>
  <label><span>列奇偶反转</span><input type="checkbox" id="parSwap"></label>

  <h2>显示</h2>
  <label><span>标注待定件</span><input type="checkbox" id="markPend" checked></label>

  <div class="info" id="info"></div>
</div>
<div id="main"><canvas id="cv"></canvas></div>
<div class="lg">
  <div><span class="sw" style="background:#4a3a50"></span>减法比较器（链上）</div>
  <div><span class="sw" style="background:#2c2c38"></span>普通比较器</div>
  <div><span class="sw" style="background:#966e46"></span>容器（空）</div>
  <div><span class="sw" style="background:#c8c8c8"></span>白色方块</div>
  <div><span class="sw" style="background:#6e6e78"></span>基底方块</div>
  <div><span class="sw" style="background:#888;border-color:#f0c040"></span>待定</div>
</div>

<script>
const PAL=[[200,45,45],[235,140,35],[240,225,55],[105,215,55],
           [35,170,190],[50,70,200],[135,50,195],[215,80,200]];
const DV={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]};
const FLIP={N:'S',S:'N',E:'W',W:'E'};

/* ============================================================
   原点 O = 最高权重减法链的第一个比较器 = (0, 0)
   rx : 相对列号（原点列 rx=0）
   Z  : 相对行号（原点行 Z=0），向上为负
   全部结构先在相对坐标里长出来，最后量包围盒再平移到 0-based 网格
   ============================================================ */
function buildSpec(n,b,o){
  const J = Math.ceil(b/2);
  const Zch  = j => -6*j;          // 链 j 的 Z
  const Zmsb = 2;                  // MSB 行
  const Ztop = Zch(J-1) - 4;       // 最低权重侧顶部（LSB 桶之上）
  const Zbot = 9;                  // 配对区底
  const Zring = Ztop + 1;          // 朝下的环放在顶部

  const m=new Map(), clash=[], K2=(x,z)=>x+','+z;
  const put=(rx,Z,c)=>{ const k=K2(rx,Z), old=m.get(k);
    if(old && !(old.t===c.t && old.c===c.c)) clash.push({rx,Z,a:old.t,b:c.t});
    m.set(k,Object.assign({rx,Z},c)); };
  const cmp=(rx,Z,fac,mode,pend)=>put(rx,Z,{t:'cmp',out:FLIP[fac],mode:mode||'compare',pend:!!pend});
  const blk=(rx,Z,c,pend)=>put(rx,Z,{t:'blk',c:c||'base',pend:!!pend});

  // 列
  const codd=i=>2*i, ceven=i=>2*i+1;         // 阵列 rx=0..2n-1
  const CO = o.parSwap?codd:ceven;            // 奇数位用的列
  const CE = o.parSwap?ceven:codd;            // 偶数位用的列
  const XI = i => o.inRev ? (n-1-i) : i;
  // 槽位按 |Z| 升序，位权从高到低依次填
  const SLOTS=[];
  for(let j=0;j<J;j++){ SLOTS.push({c:j,Z:Zch(j)+2,up:false});
                        SLOTS.push({c:j,Z:Zch(j)-2,up:true}); }
  SLOTS.sort((a,b)=> Math.abs(a.Z)-Math.abs(b.Z) || (b.Z-a.Z));  // 同 |Z| 时 +2 在前（MSB）
  const SLOT=[];
  for(let i=0;i<b;i++) SLOT[b-1-i]=SLOTS[i];       // 最高位先填最靠近 0 的槽
  const slotOf = k => SLOT[k];
  const colOf=(k,i)=>( (slotOf(k).up?CE:CO)(XI(i)) );  // 列跟着槽位走
  const rxg=-1, rxw=2*n;                      // 灰总线 / 白总线

  /* ---- 灰环 ---- */
  const zg = o.greyUp ? (Zch(0)-2) : (-6*J+4);       // 朝下：顶行 = -6J+4
  const RING=[];
  const rc=(x,z,fac)=>{ cmp(x,z,fac,'compare',true); RING.push(m.get(K2(x,z))); };
  rc(-2,zg,'E'); rc(-1,zg+1,'S'); rc(-2,zg+2,'W'); rc(-3,zg+1,'N');
  [[-3,zg],[-1,zg],[-3,zg+2],[-1,zg+2]].forEach(([x,z])=>{
    blk(x,z,'base',true); RING.push(m.get(K2(x,z))); });

  /* ---- 白环 ---- */
  const zw = o.whiteUp ? (Zmsb-1) : (Ztop+1);
  rc(rxw+1,zw,'W'); rc(rxw+2,zw+1,'N');
  rc(rxw+1,zw+2,'E'); rc(rxw,zw+1,'S');
  [[rxw,zw],[rxw+2,zw],[rxw,zw+2],[rxw+2,zw+2]].forEach(([x,z])=>{
    blk(x,z,'white',true); RING.push(m.get(K2(x,z))); });
  RING.forEach(c=>{ if(c) c.onRing=true; });   // 必须在镜像之前打标记

  /* ---- 位行 + 容器（位 0..b-2） ---- */
  const cOf = k => (k===0 ? 0 : Math.ceil(k/2));          // 从原点侧往外填
  const isUp = k => (k===0 || k%2===1);                    // 该位在上槽还是下槽
  for(let k=0;k<b-1;k++){
    const sl = slotOf(k), zc = sl.Z, zb = zc + (sl.up ? -1 : 1);
    for(let i=0;i<n;i++){
      const shown = o.bitRev ? (b-2-k) : k;
      blk(colOf(k,i),zc,'col'+((shown%8+8)%8));
      put(colOf(k,i),zb,{t:'barrel',pend:true});
    }
  }

  /* ---- 链（只给有位的一侧建比较器行） ---- */
  const hasUp=[],hasDn=[];
  for(let j=0;j<J;j++){ hasUp.push(false); hasDn.push(j===0); }
  for(let k=0;k<b-1;k++){
    const sl=slotOf(k);                    // 跟着 |Z| 排序后的真实槽位
    if(sl.up) hasUp[sl.c]=true; else hasDn[sl.c]=true;
  }
  for(let j=0;j<J;j++){
    const z4=Zch(j);
    if(hasUp[j]) for(let i=0;i<n;i++) cmp(CE(i),z4-1,'N');
    for(let i=0;i<n;i++){ cmp(codd(i),z4,'W','subtract'); cmp(ceven(i),z4,'W','subtract'); }
    if(hasDn[j]) for(let i=0;i<n;i++) cmp(CO(i),z4+1,'S');
  }

  /* ---- 灰总线（rx=-1） ---- */
  const zlo=Zch(J-1), zhi=Zch(0);
  const r0 = o.greyUp ? zlo : zg+3;
  const r1 = o.greyUp ? zg-1 : zhi;
  for(let z=r0; z<=r1; z++){
    if(m.has(K2(rxg,z))) continue;
    if(Math.abs(z)%2===0) blk(rxg,z,'base'); else cmp(rxg,z,o.greyUp?'S':'N');
  }
  for(let j=0;j<J;j++) if(!m.has(K2(rxg,Zch(j)))) blk(rxg,Zch(j),'base');

  /* ---- 白总线（rx=2n） ---- */
  const crSet=new Set(); for(let j=0;j<J;j++) crSet.add(Zch(j));
  const wStart = o.whiteUp ? zlo : zw+3;
  for(let z=wStart; z<=zhi; z++){
    if(Math.abs(z)%2===0) cmp(rxw,z,o.whiteUp?'S':'N', crSet.has(z)?'subtract':'compare');
    else blk(rxw,z,'white');
  }

  /* ---- MSB 行 ---- */
  for(let i=0;i<n;i++) blk(CO(XI(i)),Zmsb,'col'+((b-1)%8));

  /* ---- 配对区 ---- */
  const zr=Zmsb+1;
  for(let p=0;p<Math.floor(n/2);p++){
    const a=XI(2*p), bb=XI(2*p+1);
    const xa=CO(Math.min(a,bb)), xb=CO(Math.max(a,bb));
    put(xa+1,zr,{t:'barrel',pend:true});
    cmp(xa,zr,'S','compare',true); cmp(xb,zr,'S','compare',true);
    cmp(xa,zr+1,'S','compare',true); cmp(xa+1,zr+1,'N','compare',true);
    cmp(xb,zr+1,'S','compare',true);
    [2,4,6].forEach(dz=>{ blk(xa,zr+dz,'wire',true); blk(xb,zr+dz,'wire',true); });
    cmp(xa+1,zr+2,'W','subtract',true);
    cmp(xa,zr+3,'S','compare',true);   // 固定放在列号小的一侧（inRev 后 a/bb 已不可靠）
    // 这一对的 Sa 环是烧录的 => 4 个比较器是源
    const R2=[];
    cmp(xa+1,zr+4,'E','compare',true); R2.push(m.get(K2(xa+1,zr+4)));
    cmp(xa,zr+5,'N','compare',true); cmp(xb,zr+5,'S','compare',true);
    R2.push(m.get(K2(xa,zr+5)), m.get(K2(xb,zr+5)));
    cmp(xa+1,zr+6,'W','compare',true); R2.push(m.get(K2(xa+1,zr+6)));
    R2.forEach(c=>{ if(c) c.onRing=true; });
  }

  /* ---- 奇数 n：孤立输入 ---- */
  if(n%2===1){
    const x=CO(n-1);
    [[x,zr+4],[x+2,zr+4],[x,zr+2],[x,zr+6],[x+2,zr+6]].forEach(([px,pz])=>blk(px,pz,'wire',true));
    cmp(x+1,zr+4,'W','compare',true);
    cmp(x+2,zr+5,'N','compare',true);
    cmp(x+1,zr+6,'E','compare',true);
    cmp(x,zr+5,'S','compare',true);
    cmp(x,zr+3,'S','compare',true);
    cmp(x,zr+1,'S','compare',true);
    cmp(x,zr,'S','compare',true);
  }

  /* ---- 位序反转：绕 Z=0 完全对调（比较器方向 N<->S 全翻） ---- */
  const MIR = c => (o.bitRev ? -c : c);
  if(o.bitRev){
    const m2=new Map();
    m.forEach(c=>{
      const nc=Object.assign({},c,{Z:-c.Z});
      if(nc.t==='cmp') nc.out=({N:'S',S:'N',E:'E',W:'W'})[nc.out];  // Z 镜像只翻南北
      const k2=nc.rx+','+nc.Z;
      m2.set(k2,nc);
    });
    m.clear(); m2.forEach((v,k)=>m.set(k,v));
  }

  /* ---- 量包围盒 → 平移 ---- */
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  m.forEach(c=>{ if(c.rx<minX)minX=c.rx; if(c.rx>maxX)maxX=c.rx;
                 if(c.Z<minZ)minZ=c.Z;  if(c.Z>maxZ)maxZ=c.Z; });
  const W=maxX-minX+1, L=maxZ-minZ+1;
  const cells=new Map();
  m.forEach(c=>{ cells.set((c.rx-minX)+','+(c.Z-minZ),
      {x:c.rx-minX, z:c.Z-minZ, t:c.t, c:c.c, out:c.out, mode:c.mode, pend:c.pend, onRing:c.onRing}); });
  const zA = Z => MIR(Z) - minZ;
  const chainRows=[]; for(let j=0;j<J;j++) chainRows.push(zA(Zch(j)));
  return {W,L,cells,J,chainRows,zlc:zA(Zch(0)),zmsb:zA(Zmsb),
          gz:zA(zg), wz:zA(zw), zr:zA(zr), xw:rxw-minX, be:b, cut:0, clash,
          origin:{x:0-minX, z:zA(0)}};
}

/* ---------- 图检测（五类） ---------- */
function validate(spec, port){
  const {W,L,cells}=spec, clashN=(spec.clash||[]).length;
  const at=(x,z)=>cells.get(x+','+z);
  const cmps=[],others=[];
  cells.forEach(c=>{ (c.t==='cmp'?cmps:others).push(c); });
  const rearOf=c=>{const d=DV[c.out];return [c.x-d[0], c.z-d[1]];};
  const targetOf=c=>{const d=DV[c.out];return [c.x+d[0], c.z+d[1]];};

  const dead=[];
  cmps.forEach(c=>{
    const [bx,bz]=targetOf(c), b=at(bx,bz); let used=false;
    if(b&&b.t==='cmp'){
      const [rx,rz]=rearOf(b);
      if(rx===c.x&&rz===c.z) used=true;
      [[b.x-DV[b.out][1],b.z+DV[b.out][0]],[b.x+DV[b.out][1],b.z-DV[b.out][0]]]
        .forEach(([sx,sz])=>{ if(sx===c.x&&sz===c.z) used=true; });
    } else if(b){
      cmps.forEach(q=>{ if(q===c) return; const [rx,rz]=rearOf(q);
        if(rx===bx&&rz===bz) used=true; });
    }
    if(port && c.x===port[0]&&c.z===port[1]) used=true;
    if(!used) dead.push(c);
  });

  const orphan=[], unpowered=[];
  others.forEach(o=>{
    let chg=false, rd=false;
    cmps.forEach(c=>{
      const [tx,tz]=targetOf(c); if(tx===o.x&&tz===o.z) chg=true;
      const [rx,rz]=rearOf(c);
      if(rx===o.x&&rz===o.z) rd=true;
      const [r2x,r2z]=[c.x-2*DV[c.out][0], c.z-2*DV[c.out][1]];
      const mid=at(rx,rz);
      if(r2x===o.x&&r2z===o.z&&mid&&mid.t==='blk') rd=true;
    });
    const isSrc=(o.t==='barrel')||(o.t==='blk'&&(o.c||'').startsWith('col'));
    if(!chg&&!rd) orphan.push(o);
    else if(rd&&!chg&&!isSrc) unpowered.push(o);
  });

  const unreared=[];
  cmps.forEach(c=>{ const [rx,rz]=rearOf(c); if(!at(rx,rz)) unreared.push(c); });

  // 第六类：传递可达性 —— 从"有源"元件出发走一遍，走不到的都算未通达
  const unreach=[];
  {
    const key=(x,z)=>x+','+z;
    const cmap=new Map(); cmps.forEach(c=>cmap.set(key(c.x,c.z),c));
    const bmap=new Map(); others.forEach(c=>bmap.set(key(c.x,c.z),c));
    const powC=new Set(), powB=new Set();
    // 源：两个环里的比较器（烧了值）+ 带火把的彩块 + 容器
    cmps.forEach(c=>{
      const inGrey = c.x<=2 && c.y===undefined && false;
      if(c.onRing) powC.add(key(c.x,c.z));
    });
    others.forEach(b=>{ if(b.onRing) powB.add(key(b.x,b.z));
                        if(b.t==='blk'&&(b.c||'').startsWith('col')) powB.add(key(b.x,b.z));
                        if(b.t==='barrel') powB.add(key(b.x,b.z)); });
    let changed=true, guard=0;
    while(changed && guard++<500){
      changed=false;
      // 比较器：rear 有电 => 自己通电
      cmap.forEach((c,k)=>{
        if(powC.has(k)) return;
        const [rx,rz]=rearOf(c);
        if(powB.has(key(rx,rz))||powC.has(key(rx,rz))){ powC.add(k); changed=true; }
      });
      // 方块：被"已通电比较器"充能 => 通电
      cmap.forEach((c,k)=>{
        if(!powC.has(k)) return;
        const d=DV[c.out];
        const tb=bmap.get(key(c.x+d[0],c.z+d[1]));
        if(tb && !powB.has(key(tb.x,tb.z))){ powB.add(key(tb.x,tb.z)); changed=true; }
      });
    }
    cmps.forEach(c=>{ if(!powC.has(key(c.x,c.z))) unreach.push(c); });
    others.forEach(b=>{ if(!powB.has(key(b.x,b.z))) unreach.push(b); });
  }
  return {dead,orphan,unpowered,unreared,clashN,unreach};
}

function draw(){
  const n=Math.max(1,Math.min(64,+document.getElementById('n').value||4));
  const b=Math.max(2,Math.min(12,+document.getElementById('b').value||8));
  const o={greyUp:document.getElementById('greyUp').checked,
           whiteUp:document.getElementById('whiteUp').checked,
           inRev:document.getElementById('inRev').checked,
           bitRev:document.getElementById('bitRev').checked,
           parSwap:document.getElementById('parSwap').checked,
           gshift:0};
  const markPend=document.getElementById('markPend').checked;

  const badOf=t=>{ const pzz=o.whiteUp?t.chainRows[0]:t.chainRows[t.chainRows.length-1];
    const v=validate({W:t.W,L:t.L,cells:t.cells,clash:t.clash},[t.xw,pzz]);
    return v.dead.length+v.orphan.length+v.unpowered.length+v.unreared.length+v.clashN; };

  // 灰环：沿灰线方向滑到最远
  let gTop=null;
  {
    const cand=[];
    for(let z=0;z<buildSpec(n,b,o).L-2;z+=2) cand.push(z);
    cand.sort((a,c)=>o.greyUp?a-c:c-a);
    let best=null,bb=1e9;
    for(const z of cand){ const t=buildSpec(n,b,Object.assign({},o,{gRingTop:z}));
      const bad=badOf(t); if(bad===0){gTop=z;break;} if(bad<bb){bb=bad;best=z;} }
    if(gTop===null) gTop=best;
  }
  // 白环：朝上固定（不能再滑），朝下从环下方起铺总线
  let wTop=null;
  if(!o.whiteUp){
    const probe=buildSpec(n,b,Object.assign({},o,{gRingTop:gTop}));
    const cap=probe.chainRows[0]-3, cand=[];
    for(let z=1;z<=cap;z+=2) cand.push(z);
    cand.sort((a,c)=>c-a);
    let best=null,bb=1e9;
    for(const z of cand){ const t=buildSpec(n,b,Object.assign({},o,{gRingTop:gTop,wRingTop:z}));
      const bad=badOf(t); if(bad===0){wTop=z;break;} if(bad<bb){bb=bad;best=z;} }
    if(wTop===null) wTop=best;
  }
  const s=buildSpec(n,b,Object.assign({},o,{gRingTop:gTop,wRingTop:wTop}));
  const _zmin=Math.min.apply(null,s.chainRows), _zmax=Math.max.apply(null,s.chainRows);
  // 白线朝上：N 输出，值往 z 小的方向走 → 端口在最小链行
  // 白线朝下：S 输出，值往 z 大的方向走 → 端口在最大链行
  // 位序反转后流向反向，端口取另一端
  const port=[s.xw, (o.whiteUp !== o.bitRev) ? _zmin : _zmax];

  const C = s.W<=16?44 : s.W<=40?26 : s.W<=80?16 : 10;
  const PADL=52,PADT=44;
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  cv.width=(PADL+s.W*C+20)*dpr; cv.height=(PADT+s.L*C+14)*dpr;
  cv.style.width=(PADL+s.W*C+20)+'px'; cv.style.height=(PADT+s.L*C+14)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#101014'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.font=(C>=26?'10px':'8px')+' ui-monospace,Consolas,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';

  for(let z=0;z<s.L;z++)for(let x=0;x<s.W;x++){
    const c=s.cells.get(x+','+z); if(!c) continue;
    const X=PADL+x*C, Y=PADT+z*C;
    if(c.t==='cmp'){
      const sub=c.mode==='subtract';
      ctx.fillStyle=sub?'#4a3a50':'#2c2c38'; ctx.fillRect(X+1,Y+1,C-2,C-2);
      ctx.strokeStyle=sub?'#d76060':'#6a6a80'; ctx.lineWidth=1; ctx.strokeRect(X+1.5,Y+1.5,C-3,C-3);
      const d=DV[c.out],cx=X+C/2,cy=Y+C/2,r=C*0.22;
      ctx.strokeStyle=sub?'#ff6060':'#ffc355'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx-d[0]*r,cy-d[1]*r-3); ctx.lineTo(cx+d[0]*r,cy+d[1]*r-3); ctx.stroke();
      ctx.beginPath(); const tx=cx+d[0]*r*1.7,ty=cy+d[1]*r*1.7-3;
      ctx.moveTo(tx,ty); ctx.lineTo(tx-d[0]*4-d[1]*4,ty-d[1]*4+d[0]*4);
      ctx.lineTo(tx-d[0]*4+d[1]*4,ty-d[1]*4-d[0]*4); ctx.closePath();
      ctx.fillStyle=sub?'#ff6060':'#ffc355'; ctx.fill();
      if(markPend&&c.pend){ ctx.strokeStyle='#f0c040'; ctx.setLineDash([2,2]);
        ctx.strokeRect(X+1.5,Y+1.5,C-3,C-3); ctx.setLineDash([]); }
    } else if(c.t==='barrel'){
      ctx.fillStyle='#966e46'; ctx.fillRect(X+2,Y+2,C-4,C-4);
      ctx.strokeStyle='#5a4020'; ctx.lineWidth=1; ctx.strokeRect(X+2.5,Y+2.5,C-5,C-5);
      if(markPend){ ctx.strokeStyle='#f0c040'; ctx.setLineDash([2,2]);
        ctx.strokeRect(X+2.5,Y+2.5,C-5,C-5); ctx.setLineDash([]); }
    } else {
      let col='#6e6e78';
      if(c.c.startsWith('col')){ const k=+c.c.slice(3); col='rgb('+PAL[k%8].join(',')+')'; }
      else if(c.c==='white') col='#c8c8c8';
      else if(c.c==='wire') col='rgb(215,80,200)';
      ctx.fillStyle=col; ctx.fillRect(X+2,Y+2,C-4,C-4);
      ctx.strokeStyle='#d8d8d8'; ctx.lineWidth=1; ctx.strokeRect(X+2.5,Y+2.5,C-5,C-5);
      if(markPend&&c.pend){ ctx.strokeStyle='#f0c040'; ctx.setLineDash([2,2]);
        ctx.strokeRect(X+2.5,Y+2.5,C-5,C-5); ctx.setLineDash([]); }
    }
  }
  // 原点标记
  const ox=PADL+s.origin.x*C, oz=PADT+s.origin.z*C;
  ctx.strokeStyle='#5ad2ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ox+C/2,oz+C/2,C*0.44,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#5ad2ff'; ctx.fillText('O', ox+C/2, oz-10);
  // 端口
  ctx.beginPath(); ctx.arc(PADL+port[0]*C+C/2, PADT+port[1]*C+C/2, C*0.42,0,Math.PI*2);
  ctx.strokeStyle='#7fff9f'; ctx.stroke();

  ctx.fillStyle='#9a9aa8';
  const xs = s.W>40?10:1, xO = s.origin.x, zO = s.origin.z;
  for(let x=0;x<s.W;x+=xs){
    const rel = x - xO;
    ctx.fillText(rel===0?'0*':String(rel), PADL+x*C+C/2, PADT-14);
  }
  for(let z=0;z<s.L;z++){
    const rel = z - zO;
    ctx.fillStyle = rel===0 ? '#5ad2ff' : '#9a9aa8';
    ctx.fillText(rel===0?'Z0':String(rel), 24, PADT+z*C+C/2);
  }
  ctx.fillStyle='#9a9aa8';

  const v=validate({W:s.W,L:s.L,cells:s.cells,clash:s.clash}, port);
  const okAll=v.dead.length===0&&v.orphan.length===0&&v.unpowered.length===0&&v.unreared.length===0&&v.clashN===0&&v.unreach.length===0;
  let nc=0,nb=0,np=0;
  s.cells.forEach(c=>{ if(c.t==='cmp')nc++; else if(c.t==='barrel')nb++; else np++; });
  document.getElementById('info').innerHTML =
    `平面 <b>${s.W} × ${s.L}</b><br>`+
    `链数 J=<b>${s.J}</b>（ceil(b/2)）<br>`+
    `链行 ${s.chainRows.join('/')}<br>`+
    `原点 O = (${s.origin.x}, ${s.origin.z})<br>`+
    `MSB 行 z=${s.zmsb}　配对区 ${s.zr}..${Math.min(s.zr+6,s.L-1)}<br>`+
    `灰环顶 ${s.gz}　白环顶 ${s.wz}<br>`+
    `端口 (${port[0]}, ${port[1]})<br>`+
    `比较器 ${nc}　容器 ${nb}　方块 ${np}<br>`+
    `<div style="margin-top:6px;padding:6px;border-radius:5px;background:${okAll?'#12301c':'#3a1014'};color:${okAll?'#7fe0a0':'#ff8080'}">`+
    `图检测：${okAll?'通过 ✓':'失败 ✗'}<br>`+
    `死 ${v.dead.length}　孤 ${v.orphan.length}　未供 ${v.unpowered.length}　无入 ${v.unreared.length}　覆盖 ${v.clashN}　未通达 ${v.unreach.length}</div>`;
}
document.querySelectorAll('input').forEach(el=>{ el.addEventListener('input',draw); el.addEventListener('change',draw); });
draw();
</script>
</body>
</html>
